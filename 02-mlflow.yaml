apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: ml-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      containers:
      - name: mlflow
        image: ghcr.io/mlflow/mlflow:v2.11.3
        command: ["/bin/sh", "-c"]
        args:
          - pip install psycopg2-binary boto3 && mlflow server --host=0.0.0.0 --port=5500 --backend-store-uri=postgresql://postgres:admin@mlops-db:5432/postgres --default-artifact-root=s3://mlflow/ --workers=2
        env:
        - name: MLFLOW_S3_ENDPOINT_URL
          value: "http://minio-ml-workshop:9000"
        - name: AWS_ACCESS_KEY_ID
          value: "minio"
        - name: AWS_SECRET_ACCESS_KEY
          value: "minio123"
        ports:
        - containerPort: 5500
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: ml-workshop
spec:
  selector:
    app: mlflow
  ports:
  - port: 5500
    targetPort: 5500
