apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: jupyterlab-pvc
  namespace: ml-workshop
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyterlab
  namespace: ml-workshop
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyterlab
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: jupyterlab
    spec:
      securityContext:
        fsGroup: 100
      volumes:
      - name: workspace
        persistentVolumeClaim:
          claimName: jupyterlab-pvc
      containers:
      - name: jupyterlab
        image: quay.io/jupyter/pyspark-notebook:latest
        ports:
        - containerPort: 8888
        env:
        - name: JUPYTER_TOKEN
          value: "workshop"
        volumeMounts:
        - mountPath: /home/jovyan/work
          name: workspace
---
apiVersion: v1
kind: Service
metadata:
  name: jupyterlab
  namespace: ml-workshop
spec:
  selector:
    app: jupyterlab
  ports:
  - port: 8888
    targetPort: 8888
